name: Deploy verified site to GitHub Pages
on:
  workflow_run:
    workflows: [Verify GitVault]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages and choose a verified artifact
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const api = async path => {
            const r = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + path, { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' } });
            if (!r.ok) throw Error('GitHub returned ' + r.status);
            return r.json();
          };
          const repo = await api('');
          if (!repo.has_pages) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=false\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## One-time Pages setup needed\nOpen **Settings > Pages > Build and deployment > Source: GitHub Actions**, then run this workflow again. The verified static site is available in the Verify GitVault workflow artifacts. No secret or extra token is requested.\n');
            process.exit(0);
          }
          const runs = await api('/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1');
          const run = runs.workflow_runs[0];
          if (!run || run.event !== 'push') throw Error('No successful main-branch push build found');
          const head = await api('/git/ref/heads/main');
          if (head.object.sha !== run.head_sha) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=false\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Current main has not finished verification. Deployment skipped rather than publishing an outdated build.\n');
            process.exit(0);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=true\nrun_id=' + run.id + '\n');
          NODE
      - name: Download verified static site
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gitvault-static
          path: dist
          run-id: ${{ steps.gate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Configure Pages
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy verified site
        if: steps.gate.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
