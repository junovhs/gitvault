name: Publish verified screenshot gallery
on:
  workflow_run:
    workflows: [Verify GitVault]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: screenshot-gallery
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find the latest successful main verification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=10', { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' } });
          if (!response.ok) throw Error('Could not read verified runs');
          const data = await response.json();
          const run = data.workflow_runs.find(r => r.event === 'push' && r.head_branch === 'main');
          if (!run) throw Error('No successful main-branch browser run is available yet');
          appendFileSync(process.env.GITHUB_OUTPUT, 'run_id=' + run.id + '\nsha=' + run.head_sha + '\n');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: evidence
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish only allowlisted synthetic test screenshots
        run: node scripts/publish-screenshots.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCREENSHOT_RUN_ID: ${{ steps.source.outputs.run_id }}
          SCREENSHOT_TESTED_SHA: ${{ steps.source.outputs.sha }}
